id: no-silent-promise-fallback
message: 'Avoid silent fallback promises (.catch(() => null), .catch(() => ({})), or .catch(() => false)) that mask failures. Handle or propagate errors explicitly.'
severity: warning
language: javascript
rule:
    any:
        - pattern: '$PROMISE.catch(() => null)'
        - pattern: '$PROMISE.catch(() => ({}))'
        - pattern: '$PROMISE.catch(() => false)'
